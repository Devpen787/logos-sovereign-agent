name: Native spike

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LOGOSCORE_COMMIT: 8720885dd821cd63eb1da00c842328cbfd1fe5fa
  LGPM_COMMIT: 202af6fa0f0f4493bc59c8a609dff9326f78a18d

jobs:
  build-lgx:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Materialize the exact dependency lock
        run: |
          nix flake lock
          nix flake metadata --json | tee flake-metadata.json
      - name: Build development package
        run: nix build .#lgx -o result-lgx --print-build-logs
      - name: Build portable package
        run: nix build .#lgx-portable -o result-lgx-portable --print-build-logs
      - name: Record exact output identities
        run: |
          nix path-info --json ./result-lgx ./result-lgx-portable | tee nix-path-info.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("nix-path-info.json").read_text())
          records = list(data.values()) if isinstance(data, dict) else data
          assert isinstance(records, list) and len(records) == 2, data
          assert all(isinstance(record, dict) for record in records), data
          assert all(record.get("narHash") for record in records), data
          PY
          shasum -a 256 flake.lock result-lgx/*.lgx result-lgx-portable/*.lgx | tee artifact-sha256.txt
          find -L result-lgx result-lgx-portable -type f -maxdepth 4 -print | sort
      - name: Build pinned Logos Core and package manager
        run: |
          nix build "github:logos-co/logos-logoscore-cli/${LOGOSCORE_COMMIT}" -o logos --print-build-logs
          nix build "github:logos-co/logos-package-manager/${LGPM_COMMIT}#cli" -o lgpm-result --print-build-logs
          nix build "github:logos-co/logos-package-manager/${LGPM_COMMIT}#cli-portable" -o lgpm-portable-result --print-build-logs
      - name: Prove package-policy negative paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            runtime-evidence/package-negatives \
            negative-signature-modules \
            negative-dev-mismatch-modules \
            negative-portable-mismatch-modules \
            negative-corrupt-modules
          dev_lgx=$(find -L result-lgx -maxdepth 2 -name '*.lgx' -type f -print -quit)
          portable_lgx=$(find -L result-lgx-portable -maxdepth 2 -name '*.lgx' -type f -print -quit)
          test -n "$dev_lgx"
          test -n "$portable_lgx"

          expect_rejection() {
            local label=$1
            local expected=$2
            shift 2
            set +e
            "$@" > "runtime-evidence/package-negatives/${label}.txt" 2>&1
            local exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              echo "Expected ${label} to be rejected" >&2
              return 1
            fi
            grep -Eiq "$expected" "runtime-evidence/package-negatives/${label}.txt"
          }

          expect_rejection signature-required 'unsigned|signature' \
            ./lgpm-result/bin/lgpm \
            --modules-dir ./negative-signature-modules \
            --require-signatures \
            install --file "$dev_lgx"
          expect_rejection dev-cli-rejects-portable 'variant|does not contain' \
            ./lgpm-result/bin/lgpm \
            --modules-dir ./negative-dev-mismatch-modules \
            --allow-unsigned \
            install --file "$portable_lgx"
          expect_rejection portable-cli-rejects-dev 'variant|does not contain' \
            ./lgpm-portable-result/bin/lgpm \
            --modules-dir ./negative-portable-mismatch-modules \
            --allow-unsigned \
            install --file "$dev_lgx"

          python3 - "$dev_lgx" <<'PY'
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_bytes()
          assert len(source) > 2
          Path("runtime-evidence/package-negatives/corrupt.lgx").write_bytes(
              source[: len(source) // 2]
          )
          PY
          expect_rejection corrupt-archive 'failed|invalid|load|archive|package' \
            ./lgpm-result/bin/lgpm \
            --modules-dir ./negative-corrupt-modules \
            --allow-unsigned \
            install --file runtime-evidence/package-negatives/corrupt.lgx
      - name: Install and exercise the module through Logos Core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modules runtime-evidence runtime-config
          cp -RL logos/modules/. modules/
          lgx_path=$(find -L result-lgx -maxdepth 2 -name '*.lgx' -type f -print -quit)
          test -n "$lgx_path"
          ./lgpm-result/bin/lgpm \
            --modules-dir ./modules \
            --allow-unsigned \
            install --file "$lgx_path" | tee runtime-evidence/lgpm-install.txt
          ./lgpm-result/bin/lgpm --modules-dir ./modules info sovereign_agent --json \
            | tee runtime-evidence/lgpm-info.json

          ./logos/bin/logoscore -D --config-dir ./runtime-config -m ./modules \
            > runtime-evidence/daemon.log 2>&1 &
          daemon_pid=$!
          cleanup() {
            ./logos/bin/logoscore --config-dir ./runtime-config stop >/dev/null 2>&1 || true
            wait "$daemon_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 45); do
            if ./logos/bin/logoscore --config-dir ./runtime-config status --json \
              > runtime-evidence/status-before-load.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          ./logos/bin/logoscore --config-dir ./runtime-config list-modules --json \
            | tee runtime-evidence/modules-before-load.json
          ./logos/bin/logoscore --config-dir ./runtime-config load-module sovereign_agent \
            | tee runtime-evidence/load.json
          ./logos/bin/logoscore --config-dir ./runtime-config module-info sovereign_agent --json \
            | tee runtime-evidence/module-info.json
          ./logos/bin/logoscore --config-dir ./runtime-config call sovereign_agent version --json \
            | tee runtime-evidence/version-call.json
          ./logos/bin/logoscore --config-dir ./runtime-config call sovereign_agent status --json \
            | tee runtime-evidence/status-call-before-reload.json
          ./logos/bin/logoscore --config-dir ./runtime-config stats --json \
            | tee runtime-evidence/stats.json
          ./logos/bin/logoscore --config-dir ./runtime-config reload-module sovereign_agent \
            | tee runtime-evidence/reload.json
          ./logos/bin/logoscore --config-dir ./runtime-config call sovereign_agent status --json \
            | tee runtime-evidence/status-call-after-reload.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = Path("runtime-evidence")
          modules = json.loads((evidence / "modules-before-load.json").read_text())
          assert any(item["name"] == "sovereign_agent" for item in modules), modules

          info = json.loads((evidence / "module-info.json").read_text())
          assert info["name"] == "sovereign_agent", info
          assert info["status"] == "loaded", info
          methods = {method["name"] for method in info["methods"]}
          assert {"version", "status"}.issubset(methods), info

          version = json.loads((evidence / "version-call.json").read_text())
          assert version["status"] == "ok", version
          assert version["result"] == "0.1.0", version

          expected = {
              "module": "sovereign_agent",
              "state": "native_spike",
              "version": "0.1.0",
          }
          before = json.loads((evidence / "status-call-before-reload.json").read_text())
          after = json.loads((evidence / "status-call-after-reload.json").read_text())
          assert json.loads(before["result"]) == expected, before
          assert json.loads(after["result"]) == expected, after
          PY

          ./logos/bin/logoscore --config-dir ./runtime-config status --json \
            | tee runtime-evidence/status-after-reload.json
          ./logos/bin/logoscore --config-dir ./runtime-config stop \
            | tee runtime-evidence/stop.json
          wait "$daemon_pid"
          trap - EXIT
          ./logos/bin/logoscore --config-dir ./runtime-config status --json \
            > runtime-evidence/status-after-stop.json 2>&1 || true
          python3 - <<'PY'
          import json
          from pathlib import Path

          stopped = json.loads(
              Path("runtime-evidence/status-after-stop.json").read_text()
          )
          assert stopped["daemon"]["status"] == "not_running", stopped
          PY

          ./logos/bin/logoscore -D --config-dir ./runtime-config -m ./modules \
            > runtime-evidence/daemon-after-restart.log 2>&1 &
          daemon_pid=$!
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 45); do
            if ./logos/bin/logoscore --config-dir ./runtime-config status --json \
              > runtime-evidence/status-after-daemon-restart.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          ./logos/bin/logoscore --config-dir ./runtime-config load-module sovereign_agent \
            | tee runtime-evidence/load-after-daemon-restart.json
          ./logos/bin/logoscore --config-dir ./runtime-config call sovereign_agent status --json \
            | tee runtime-evidence/status-call-after-daemon-restart.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "module": "sovereign_agent",
              "state": "native_spike",
              "version": "0.1.0",
          }
          restarted = json.loads(
              Path("runtime-evidence/status-call-after-daemon-restart.json").read_text()
          )
          assert json.loads(restarted["result"]) == expected, restarted
          PY
          ./logos/bin/logoscore --config-dir ./runtime-config stop \
            | tee runtime-evidence/stop-after-daemon-restart.json
          wait "$daemon_pid"
          trap - EXIT
          ./logos/bin/logoscore --config-dir ./runtime-config status --json \
            > runtime-evidence/status-after-final-stop.json 2>&1 || true
          python3 - <<'PY'
          import json
          from pathlib import Path

          stopped = json.loads(
              Path("runtime-evidence/status-after-final-stop.json").read_text()
          )
          assert stopped["daemon"]["status"] == "not_running", stopped
          PY
      - name: Upload auditable native-spike evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: native-spike-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifact-sha256.txt
            flake.lock
            flake-metadata.json
            nix-path-info.json
            result-lgx/*.lgx
            result-lgx-portable/*.lgx
            runtime-evidence/
